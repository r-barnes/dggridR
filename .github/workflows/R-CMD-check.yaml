# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  debian-clang-check:
    runs-on: ubuntu-latest
    container:
      image: debian:testing

    name: Debian testing (R-devel, clang)

    steps:
      - name: Install system dependencies
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            libc++-dev \
            libc++abi-dev \
            git \
            r-base-dev \
            libgdal-dev \
            libgeos-dev \
            libgeos++-dev \
            libproj-dev \
            libudunits2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libsqlite3-dev \
            libbz2-dev \
            zlib1g-dev \
            pandoc \
            qpdf \
            ghostscript \
            wget

      - uses: actions/checkout@v4

      - name: Configure build environment
        run: |
          # Set compilers
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

          # Display versions
          echo "=== Compiler Versions ==="
          clang --version
          clang++ --version

          # Configure gdal and geos for sf package
          echo "=== Spatial Library Configuration ==="
          gdal-config --version
          geos-config --version

      - name: Install R package dependencies
        env:
          CC: clang
          CXX: clang++
        run: |
          options(repos = c(CRAN = 'https://cloud.r-project.org'))
          cat("Installing remotes and rcmdcheck...\n")
          install.packages(c('remotes', 'rcmdcheck'), Ncpus = 2)

          cat("\nInstalling package dependencies...\n")
          # Install dependencies with proper compiler settings
          remotes::install_deps(dependencies = TRUE, upgrade = "never", Ncpus = 2)

          cat("\nVerifying all required packages:\n")
          required_pkgs <- c("Rcpp", "collapse", "sf", "wk", "rcmdcheck")
          all_ok <- TRUE
          for (pkg in required_pkgs) {
            if (requireNamespace(pkg, quietly = TRUE)) {
              cat(sprintf("✓ %s: %s\n", pkg, packageVersion(pkg)))
            } else {
              cat(sprintf("✗ %s: NOT INSTALLED\n", pkg))
              all_ok <- FALSE
            }
          }
          if (!all_ok) stop("Some required packages failed to install")
          cat("\n✓ All dependencies installed successfully\n")
        shell: Rscript {0}

      - name: Show R and compiler configuration
        run: |
          cat("R version:\n")
          print(R.version)
          cat("\nCompiler configuration:\n")
          system("$CC --version")
          system("$CXX --version")
        shell: Rscript {0}

      - name: Check package
        run: |
          Sys.setenv("_R_CHECK_FORCE_SUGGESTS_" = "false")
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran", "--no-vignettes"),
            build_args = c("--no-manual", "--no-build-vignettes"),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debian-clang-results
          path: check
